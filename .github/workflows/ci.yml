name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

# Actions are pinned to commit SHAs (the tag is a comment for humans and Dependabot).
# Integration tests need the local WordPress stack (bin/dev up) and run outside CI.
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d # v10.4.0
        with:
          python-version: ${{ matrix.python }}
      - run: uv sync --locked --extra dev
      - run: .venv/bin/ruff check src tests
      - run: .venv/bin/ruff format --check src tests
      - run: .venv/bin/pytest --cov --cov-report=term-missing:skip-covered

  audit:
    # Known vulnerabilities in the pinned set that is installed on the server.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d # v10.4.0
      - run: uvx pip-audit --no-deps --disable-pip -r deploy/requirements.txt

  scripts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: shellcheck -x bin/* deploy/*.sh deploy/wpmcp-admin
      - name: bridge plugin parses
        run: find wordpress dev deploy -name '*.php' -print0 | xargs -0 -n1 php -l

  infra:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: "1.5.7"
          terraform_wrapper: false
      - run: terraform fmt -check -recursive infra
      - name: validate both stacks
        run: |
          for stack in infra/instance infra/dns infra/mail; do
            terraform -chdir="$stack" init -backend=false -input=false
            terraform -chdir="$stack" validate
          done
