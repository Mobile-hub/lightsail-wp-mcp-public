# wpmcp, plain HTTP, on Debian's Apache (Lightsail's own WordPress image): ACME challenges
# for the certificate (certbot --webroot), everything else to HTTPS.
# The file name sorts after 000-default.conf on purpose: requests for any other name keep
# reaching the site's default vhost.
# A template: bin/deploy fills in the host name (MCP_HOST from the site file).
<VirtualHost *:80>
  ServerName @MCP_HOST@
  DocumentRoot /var/lib/wpmcp-acme
  <Directory /var/lib/wpmcp-acme>
    Options None
    AllowOverride None
    Require all granted
    php_admin_flag engine off
  </Directory>
  RewriteEngine On
  RewriteCond %{REQUEST_URI} !^/\.well-known/acme-challenge/
  RewriteRule ^ https://@MCP_HOST@%{REQUEST_URI} [R=301,L,NE]
  ErrorLog ${APACHE_LOG_DIR}/mcp-error.log
  CustomLog ${APACHE_LOG_DIR}/mcp-access.log "%h %t \"%r\" %>s %b %D"
</VirtualHost>
