# Keep-alive for the whole server (written by lightsail-wp-mcp remote-install.sh).
# This image runs Apache prefork with five workers, and an idle keep-alive connection holds
# one: a browser opens several, while an MCP call needs two at once (proxy, bridge request)
# and a SEOPress analysis three (its page load). 2 s still keeps a page's files on one
# connection and frees the worker sooner than the default 5 s.
KeepAliveTimeout 2
