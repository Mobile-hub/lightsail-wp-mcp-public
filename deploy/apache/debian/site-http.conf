# The WordPress site, plain HTTP, on Lightsail's own image (installed by setup.debian.sh in
# place of the image's 000-default.conf): ACME challenges for the site's certificate
# (certbot --webroot), everything else to https://WP_HOST. Sorts first in sites-enabled, so
# it is also the answer for an unknown name or the bare address.
# A template: bin/setup-server fills in the host names (WP_HOST, WP_ALIASES).
<VirtualHost *:80>
  ServerName @WP_HOST@
  @SERVER_ALIAS@
  DocumentRoot /var/www/html
  RewriteEngine On
  RewriteCond %{REQUEST_URI} !^/\.well-known/acme-challenge/
  RewriteRule ^ https://@WP_HOST@%{REQUEST_URI} [R=301,L,NE]
  ErrorLog ${APACHE_LOG_DIR}/error.log
  CustomLog ${APACHE_LOG_DIR}/access.log combined
</VirtualHost>
