# The WordPress site over HTTPS on Lightsail's own image (installed by setup.debian.sh in
# place of the image's default-ssl.conf). Other names of the site are redirected to WP_HOST.
# The permalink rules are in conf-available/wordpress-permalinks.conf: the image reads no
# .htaccess, and the web server may write the web root.
# A template: bin/setup-server fills in the host names (WP_HOST, WP_ALIASES).
<VirtualHost *:443>
  ServerName @WP_HOST@
  @SERVER_ALIAS@
  DocumentRoot /var/www/html
  SSLEngine on
  SSLCertificateFile "/etc/letsencrypt/live/@WP_HOST@/fullchain.pem"
  SSLCertificateKeyFile "/etc/letsencrypt/live/@WP_HOST@/privkey.pem"

  RewriteEngine On
  RewriteCond %{HTTP_HOST} !^@WP_HOST_RE@$ [NC]
  RewriteRule ^ https://@WP_HOST@%{REQUEST_URI} [R=301,L,NE]

  Header always set Strict-Transport-Security "max-age=31536000"
  Header always set X-Content-Type-Options "nosniff"
  Header always set X-Frame-Options "SAMEORIGIN"
  Header always set Referrer-Policy "strict-origin-when-cross-origin"
  Header always unset X-Powered-By

  ErrorLog ${APACHE_LOG_DIR}/error.log
  CustomLog ${APACHE_LOG_DIR}/access.log combined
</VirtualHost>
