# wpmcp, plain HTTP: ACME challenges for the certificate, everything else to HTTPS.
# The file name sorts before wordpress-vhost.conf on purpose: that vhost has
# "ServerAlias *" and would otherwise answer for this name too.
# A template: bin/deploy fills in the host name (MCP_HOST from the site file).
<VirtualHost 127.0.0.1:80 _default_:80>
  ServerName @MCP_HOST@
  DocumentRoot /opt/bitnami/apps/letsencrypt
  Include "/opt/bitnami/apps/letsencrypt/conf/httpd-prefix.conf"
  RewriteEngine On
  RewriteCond %{REQUEST_URI} !^/\.well-known/acme-challenge/
  RewriteRule ^ https://@MCP_HOST@%{REQUEST_URI} [R=301,L,NE]
</VirtualHost>
