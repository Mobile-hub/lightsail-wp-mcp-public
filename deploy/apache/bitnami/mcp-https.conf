# wpmcp over HTTPS: TLS here, everything else in the service behind the Unix socket.
# Same address set as the WordPress vhost, selected by name (SNI).
# A template: bin/deploy fills in the host name (MCP_HOST from the site file).
<VirtualHost 127.0.0.1:443 _default_:443>
  ServerName @MCP_HOST@
  SSLEngine on
  SSLCertificateFile "/opt/bitnami/letsencrypt/certificates/@MCP_HOST@.crt"
  SSLCertificateKeyFile "/opt/bitnami/letsencrypt/certificates/@MCP_HOST@.key"

  Header always set Strict-Transport-Security "max-age=31536000"
  Header always unset X-Powered-By

  # The service checks Host against its public name; Apache appends the client address to
  # X-Forwarded-For, and the service trusts only that last hop.
  ProxyPreserveHost On
  ProxyRequests Off
  ProxyTimeout 120
  # The OAuth and MCP endpoints, nothing else (no file system, no PHP).
  ProxyPass "/" "unix:/run/wpmcp/wpmcp.sock|http://wpmcp/" flushpackets=on
  ProxyPassReverse "/" "http://wpmcp/"

  LimitRequestBody 5242880
  # Single-use image upload links: up to 10 MB images (the service caps them too).
  <Location "/upload/">
    LimitRequestBody 11534336
  </Location>
  ErrorLog "/opt/bitnami/apache/logs/mcp-error_log"
  CustomLog "/opt/bitnami/apache/logs/mcp-access_log" "%h %t \"%r\" %>s %b %D"
</VirtualHost>
